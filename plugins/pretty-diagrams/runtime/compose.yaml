services:
  excalidraw:
    build: .
    image: gm2211/pretty-diagrams:0.2.0
    init: true
    restart: unless-stopped
    networks:
      - local-only
    volumes:
      - checkpoints:/tmp/excalidraw-mcp-checkpoints
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
  ingress:
    build:
      context: .
      dockerfile: Dockerfile.ingress
    image: gm2211/pretty-diagrams-ingress:0.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - default
      - local-only
    depends_on:
      excalidraw:
        condition: service_healthy

volumes:
  checkpoints:

networks:
  default: {}
  local-only:
    internal: true
